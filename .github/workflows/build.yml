name: Build Nyra

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract Nyra
        run: |
          unzip -q *.zip -d nyra-project
          echo "Extracted files:"
          find nyra-project -maxdepth 2 -type f | head -50

      - name: Build Nyra
        working-directory: nyra-project
        run: |
          gradle build --no-daemon --stacktrace

      - name: Upload Nyra JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nyra-JAR
          path: nyra-project/**/build/libs/*.jar
