name: Build Nyra

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Gradle project
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ] || \
             [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            PROJECT_DIR=""
            while IFS= read -r file; do
              PROJECT_DIR="${file%/*}"
              break
            done < <(
              find . -mindepth 2 -maxdepth 5 -type f \
                \( -name settings.gradle \
                -o -name settings.gradle.kts \) \
                -not -path '*/.gradle/*' \
                -not -path '*/build/*' | sort
            )

            if [ -z "$PROJECT_DIR" ]; then
              while IFS= read -r file; do
                PROJECT_DIR="${file%/*}"
                break
              done < <(
                find . -mindepth 2 -maxdepth 5 -type f \
                  \( -name build.gradle \
                  -o -name build.gradle.kts \) \
                  -not -path '*/.gradle/*' \
                  -not -path '*/build/*' | sort
              )
            fi

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: No Gradle project found."
              exit 1
            fi

            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Build with Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          echo "Building project in: $PWD"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon --stacktrace
          else
            gradle build --no-daemon --stacktrace
          fi

      - name: Upload JAR files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyra-build
          path: '**/build/libs/*.jar'
          if-no-files-found: warn
          retention-days: 14
