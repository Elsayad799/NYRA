name: Build Nyra

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Nyra
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload Nyra JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nyra-JAR
          path: build/libs/*.jar
