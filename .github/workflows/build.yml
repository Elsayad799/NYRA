name: Build Nyra

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate and extract Nyra source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'NYRA_1_20_1_source_visual_forms_v7*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [ -z "$ZIP" ]; then
            echo 'ERROR: Upload NYRA_1_20_1_source_visual_forms_v7*.zip to repository root.'
            ls -la
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          PROJECT_DIR="$(find extracted -type f -name build.gradle -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then echo 'ERROR: build.gradle not found in source archive'; find extracted -maxdepth 3 -type f; exit 1; fi
          echo "NYRA_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using source archive: $ZIP"
          echo "Project directory: $PROJECT_DIR"

      - name: Build Nyra
        run: gradle -p "$NYRA_PROJECT_DIR" build --no-daemon --stacktrace --console=plain

      - name: Run Python Core tests (if present)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$NYRA_PROJECT_DIR/nyra_core" ]; then
            shopt -s nullglob
            tests=("$NYRA_PROJECT_DIR"/nyra_core/test_*.py)
            for test in "${tests[@]}"; do python3 "$test"; done
          fi

      - name: Upload Nyra JARs
        uses: actions/upload-artifact@v4
        with:
          name: Nyra-jar
          path: |
            ${{ env.NYRA_PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
          
