name: Build Nyra

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        shell: bash
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extract Nyra source ZIP
        shell: bash
        run: |
          ZIP="NYRA_1_20_1_source_visual_forms_v5.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found at repository root: $ZIP"
            echo "Repository files:"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q -o "$ZIP" -d extracted

          if [ ! -f extracted/nyra/settings.gradle ] && [ ! -f extracted/nyra/settings.gradle.kts ]; then
            echo "ERROR: Gradle settings file not found at extracted/nyra. ZIP structure may have changed."
            find extracted -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi

          if [ ! -f extracted/nyra/build.gradle ] && [ ! -f extracted/nyra/build.gradle.kts ]; then
            echo "ERROR: Gradle build file not found at extracted/nyra."
            exit 1
          fi

      - name: Build Nyra
        shell: bash
        run: |
          cd extracted/nyra
          gradle build --no-daemon --stacktrace

      - name: Upload JAR files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyra-build
          path: extracted/nyra/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
